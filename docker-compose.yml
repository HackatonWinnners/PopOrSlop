services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: poporslop
      POSTGRES_PASSWORD: poporslop
      POSTGRES_DB: poporslop
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poporslop"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Full event stack: docker compose --profile full up
  # (migrate + seed once via: pnpm db:migrate && pnpm seed:demo against the db)
  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgres://poporslop:poporslop@db:5432/poporslop
      SESSION_SECRET: ${SESSION_SECRET:-change-me-for-the-event}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
