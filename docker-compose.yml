services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: poporslop
      POSTGRES_PASSWORD: poporslop
      POSTGRES_DB: poporslop
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poporslop"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
